<body>
    <br>
    <h1>✨ Cuppa Matcha - THE SKU Generator ✨</h1>
    <div class="container text-center">
    <div id="CuppaM_SKU"></div>
    <form>
        <label id="options">Signature Drinks</label>
        <br>
        <select id="category" class="form-select mb-3">
                <option value="">Select a drink</option>
                <option value="Klasik Matcha Latte">Klasik Matcha Latte</option>
                <option value="Strawberry Matcha Latte">Strawberry Matcha Latte</option>
                <option value="Ube Matcha Latte">Ube Matcha Latte</option>
                <option value="Choco Champorado Matcha">Choco Champorado Matcha</option>
            </select>

            <label class="form-label">Retail & Packaged Goods</label>
            <br>
            <!-- Changed id to match python code -->
            <select id="product" class="form-select mb-3">
                <option value="">Select a product</option>
                <option value="Ceremonial Grade Matcha Powder">Ceremonial Grade Matcha Powder</option>
                <option value="Culinary Grade Matcha Powder">Culinary Grade Matcha Powder</option>
                <option value="Matcha Vanilla Blend Syrup">Matcha Vanilla Blend Syrup</option>
                <option value="Ube Jam">Ube Jam</option>
                <option value="Chocolate Tablea">Chocolate Tablea</option>
                <option value="Fresh Strawberries">Fresh Strawberries</option>
            </select>

            <label class="form-label">Stock Quantity</label>
            <br>
            <!-- Fixed duplicate ID and gave it a proper unique ID -->
            <input type="text" id="stock_qty" class="form-control mb-3" placeholder="Example: 50" required>
            <br>
            <button type="button" py-click="display_char" id="btn" class="btn">Generate</button>
            <br><br>
            <label>Your generated SKU will appear below:</label>
        </form>

    <div id="output2">
    <script type="py" src="main.py"></script>
    </div>
